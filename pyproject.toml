[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-detection-ablation"
version = "0.2.0"
description = "AI-Generated Text Detection via DistilBERT Fine-Tuning — ablation study of held-out-generator generalization, NF4 quantisation, and inference optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai-detection", "distilbert", "adversarial-robustness", "raid-benchmark"]

dependencies = [
    "torch>=2.6.0",
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "transformers>=5.6.2",
    "scikit-learn>=1.7.0",
    "pandas>=2.3.0",
    "numpy>=1.26.4",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.4",
    "pyyaml>=6.0.3",
    "pyarrow>=23.0.0",
    "kagglehub>=1.0.0",
    "kaleido>=1.0.0",
    "plotly>=5.24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]


