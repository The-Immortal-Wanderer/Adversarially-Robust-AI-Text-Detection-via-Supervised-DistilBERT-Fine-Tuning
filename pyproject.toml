[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-detection-ablation"
version = "0.2.0"
description = "AI-Generated Text Detection via DistilBERT Fine-Tuning — ablation study of held-out-generator generalization, NF4 quantisation, and inference optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai-detection", "distilbert", "adversarial-robustness", "raid-benchmark"]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "tqdm>=4.66.4",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "accelerate>=0.30.1",
    "datasets>=2.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]


